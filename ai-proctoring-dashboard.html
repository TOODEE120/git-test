<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบการสอบ AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #fff5f5 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #f3d7e6;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .header-left {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1e293b;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 500;
            color: #1e293b;
        }

        .timer {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            min-width: 120px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Left Sidebar */
        .sidebar {
            width: 30%;
            background-color: #fff1f2;
            border-right: 1px solid #f3d7e6;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .card {
            background-color: #ffffff;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
            border: 1px solid #f3d7e6;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1e293b;
        }

        /* Student List */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .student-item {
            background: linear-gradient(135deg, #fffafc 0%, #fff5f8 100%);
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #f3d7e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-item:hover {
            background: #fff1f2;
            border-color: rgba(244, 63, 94, 0.5);
            transform: translateX(4px);
        }

        .student-item.active {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border-color: #f43f5e;
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.3);
        }

        .student-item.active .student-name {
            color: white;
        }

        .student-item.active .risk-score {
            color: #1e293b;
        }

        .student-name {
            font-weight: 500;
            font-size: 1rem;
            color: #1e293b;
        }

        .risk-score {
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
        }

        .risk-green {
            background-color: rgba(34, 197, 94, 0.2);
            color: #16a34a;
        }

        .risk-yellow {
            background-color: rgba(250, 204, 21, 0.2);
            color: #ea580c;
        }

        .risk-red {
            background-color: rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }

        /* Main Content Area */
        .main-content {
            width: 70%;
            background: linear-gradient(135deg, #fff1f2 0%, #fff5f5 100%);
            overflow-y: auto;
            padding: 1.5rem;
        }

        .content-hidden {
            display: none !important;
        }

        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #94a3b8;
        }

        /* Student Details */
        .student-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .detail-box {
            background-color: #ffffff;
            padding: 1rem;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            border: 1px solid #f3d7e6;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
        }

        .detail-label {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .detail-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
        }

        .risk-score-large {
            font-size: 2rem;
            font-weight: 700;
        }

        /* Two Column Layout for Activity and AI Status */
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Activity Summary */
        .activity-list {
            list-style: none;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-label {
            color: #475569;
            font-weight: 500;
        }

        .activity-value {
            font-weight: 600;
            color: #1e293b;
            font-family: 'Courier New', monospace;
        }

        /* AI Status */
        .status-list {
            list-style: none;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .status-icon {
            font-size: 1.25rem;
            min-width: 30px;
        }

        .status-ok {
            color: #16a34a;
        }

        .status-warning {
            color: #ea580c;
        }

        .status-error {
            color: #dc2626;
        }

        /* Event Log */
        .event-log {
            margin-bottom: 1.5rem;
        }

        .event-list {
            list-style: none;
            background-color: #ffffff;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding: 0;
            border: 1px solid #f3d7e6;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
        }

        .event-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
            color: #1e293b;
        }

        .event-item:hover {
            background-color: #fffafc;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-time {
            font-family: 'Courier New', monospace;
            color: #f43f5e;
            font-weight: 600;
            min-width: 60px;
            margin-right: 1rem;
        }

        .event-description {
            color: #475569;
        }

        /* Evidence Section */
        .evidence-section {
            margin-bottom: 1.5rem;
        }

        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .evidence-item {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #f3d7e6;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
        }

        .evidence-item:hover {
            border-color: #f43f5e;
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.2);
        }

        .evidence-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #fff1f2, #fff5f8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid #f3d7e6;
        }

        .evidence-time {
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #f43f5e;
            text-align: center;
            font-weight: 600;
        }

        .evidence-description {
            padding: 0 0.75rem 0.75rem;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #f3d7e6;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #f43f5e;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            .evidence-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #f3d7e6;
                max-height: 300px;
            }

            .main-content {
                width: 100%;
            }

            .student-details {
                grid-template-columns: 1fr;
            }

            .evidence-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }

        /* Animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-details,
        .card {
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span>📚</span>
            <span>ระบบตรวจสอบการสอบ AI</span>
        </div>
        <div class="header-right">
            <span>⏱</span>
            <div class="timer" id="timer">00:00:00</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="card">
                <div class="card-title">
                    <span>👥</span>
                    <span>รายชื่อนักเรียน</span>
                </div>
                <div class="student-list" id="studentList"></div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div id="noSelection" class="no-selection">
                <div>
                    <div style="font-size: 3rem; margin-bottom: 1rem;">👋</div>
                    <div style="font-size: 1.25rem; font-weight: 500; color: #64748b;">เลือกนักเรียนจากรายชื่อทางซ้ายเพื่อดูรายละเอียด</div>
                </div>
            </div>

            <div id="studentContent" class="content-hidden">
                <!-- Student Info -->
                <div class="student-details">
                    <div class="detail-box">
                        <div class="detail-label">👤 ชื่อผู้สอบ</div>
                        <div class="detail-value" id="detailName">-</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">🔢 เลขที่</div>
                        <div class="detail-value" id="detailId">-</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">🏫 ชั้น</div>
                        <div class="detail-value" id="detailClass">-</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">⚠️ คะแนนความเสี่ยง</div>
                        <div class="detail-value risk-score-large" id="detailRisk">-</div>
                    </div>
                </div>

                <!-- Exam Score and Current Time -->
                <div class="student-details">
                    <div class="detail-box">
                        <div class="detail-label">📚 คะแนนสอบ</div>
                        <div class="detail-value" id="detailScore">-</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">🕒 เวลาเปิดดู</div>
                        <div class="detail-value" id="detailCurrentTime">-</div>
                    </div>
                </div>

                <!-- Activity Summary and AI Status -->
                <div class="two-column">
                    <!-- Card 1: Activity Summary -->
                    <div class="card">
                        <div class="card-title">
                            <span>📊</span>
                            <span>สรุปกิจกรรม</span>
                        </div>
                        <ul class="activity-list" id="activityList"></ul>
                    </div>

                    <!-- Card 2: AI Status -->
                    <div class="card">
                        <div class="card-title">
                            <span>🤖</span>
                            <span>สถานะ AI</span>
                        </div>
                        <ul class="status-list" id="statusList"></ul>
                    </div>
                </div>

                <!-- Event Log -->
                <div class="event-log">
                    <div class="card-title">
                        <span>📋</span>
                        <span>ลำดับเหตุการณ์</span>
                    </div>
                    <ul class="event-list" id="eventList"></ul>
                </div>

                <!-- Evidence Section -->
                <div class="evidence-section">
                    <div class="card-title">
                        <span>📷</span>
                        <span>หลักฐานภาพ</span>
                    </div>
                    <div class="evidence-grid" id="evidenceGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Data
        const studentsData = [
            {
                id: 1,

                studentId: '001',
                className: '6/1',

                ],
                evidence: [

                    { time: '09:30', description: 'ตรวจสอบประจำตัว', emoji: '✅' }
                ]
            },
            {

                name: 'อารีน่า สมิงห์',
                studentId: '002',
                className: '6/1',
                riskScore: 48,
                examScore: 76,
                activities: {
                    tabSwitch: 3,
                    pasteAttempts: 1,
                    avgResponseTime: 3.2,
                    fastAnswers: 1,
                    mouseMovement: 'ปกติ',
                    faceTurns: 8
                },
                status: {
                    faceFound: true,
                    personCount: 1,
                    phoneFound: true,
                    headDown: true
                },
                events: [
                    { time: '09:00', description: 'เริ่มสอบ' },
                    { time: '09:05', description: 'สลับแท็บ' },
                    { time: '09:12', description: 'พบโทรศัพท์' },
                    { time: '09:20', description: 'ก้มหน้าบ่อย' },
                    { time: '09:25', description: 'พยายามวางข้อความ' }
                ],
                evidence: [
                    { time: '09:12', description: 'พบโทรศัพท์', emoji: '📱' },
                    { time: '09:20', description: 'ก้มหน้าบ่อย', emoji: '⬇️' },
                    { time: '09:25', description: 'สลับแท็บ', emoji: '🔀' }
                ]
            },
            {
                id: 3,
                name: 'จอห์น สมิธ',
                studentId: '003',
                className: '6/2',
                riskScore: 82,
                examScore: 45,
                activities: {
                    tabSwitch: 12,
                    pasteAttempts: 8,
                    avgResponseTime: 0.8,
                    fastAnswers: 6,
                    mouseMovement: 'ผิดปกติ',
                    faceTurns: 25
                },
                status: {
                    faceFound: false,
                    personCount: 2,
                    phoneFound: true,
                    headDown: true
                },
                events: [
                    { time: '10:01', description: 'สลับแท็บ' },
                    { time: '10:02', description: 'พบโทรศัพท์' },
                    { time: '10:03', description: 'ก้มหน้า' },
                    { time: '10:04', description: 'วางข้อความ' },
                    { time: '10:06', description: 'ตอบข้อ 15 ภายใน 0.8 วินาที' },
                    { time: '10:08', description: 'ไม่พบใบหน้า' }
                ],
                evidence: [
                    { time: '10:02', description: 'พบโทรศัพท์', emoji: '📱' },
                    { time: '10:03', description: 'ก้มหน้าบ่อย', emoji: '⬇️' },
                    { time: '10:04', description: 'พบหลายคนในภาพ', emoji: '👥' }
                ]
            },
            {
                id: 4,
                name: 'ไมค์ ชาติประนอม',
                studentId: '004',
                className: '6/1',
                riskScore: 15,
                examScore: 92,
                activities: {
                    tabSwitch: 1,
                    pasteAttempts: 0,
                    avgResponseTime: 2.0,
                    fastAnswers: 0,
                    mouseMovement: 'ปกติ',
                    faceTurns: 3
                },
                status: {
                    faceFound: true,
                    personCount: 1,
                    phoneFound: false,
                    headDown: false
                },
                events: [
                    { time: '09:00', description: 'เริ่มสอบ' },
                    { time: '09:45', description: 'ตอบข้อ 10 ภายใน 2.1 วินาที' },
                    { time: '10:00', description: 'ส่งข้อสอบ' }
                ],
                evidence: [
                    { time: '09:00', description: 'ตรวจสอบเริ่มต้น', emoji: '✅' },
                    { time: '10:00', description: 'ส่งข้อสอบสำเร็จ', emoji: '✅' }
                ]
            }
        ];

        let currentStudent = null;

        // Initialize
        function init() {
            renderStudentList();
            updateTimer();
            setInterval(updateTimer, 1000);
            setInterval(updateCurrentTime, 1000);
        }

        // Render Student List
        function renderStudentList() {
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = '';

            studentsData.forEach(student => {
                const item = document.createElement('div');
                item.className = 'student-item';
                
                const riskClass = student.riskScore < 30 ? 'risk-green' : 
                                 student.riskScore < 60 ? 'risk-yellow' : 'risk-red';

                item.innerHTML = `
                    <div class="student-name">${student.name}</div>
                    <div class="risk-score ${riskClass}">${student.riskScore}</div>
                `;

                item.addEventListener('click', () => selectStudent(student.id));
                studentList.appendChild(item);
            });
        }

        // Select Student
        function selectStudent(studentId) {
            currentStudent = studentsData.find(s => s.id === studentId);
            
            // Update active state
            document.querySelectorAll('.student-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Show content
            document.getElementById('noSelection').classList.add('content-hidden');
            document.getElementById('studentContent').classList.remove('content-hidden');

            // Render content
            renderStudentContent();
        }

        // Render Student Content
        function renderStudentContent() {
            if (!currentStudent) return;

            // Basic Info
            document.getElementById('detailName').textContent = currentStudent.name;
            document.getElementById('detailId').textContent = currentStudent.studentId;
            document.getElementById('detailClass').textContent = currentStudent.className;
            
            const riskClass = currentStudent.riskScore < 30 ? 'risk-green' : 
                             currentStudent.riskScore < 60 ? 'risk-yellow' : 'risk-red';
            const riskElement = document.getElementById('detailRisk');
            riskElement.textContent = `${currentStudent.riskScore}/100`;
            riskElement.className = `detail-value risk-score-large ${riskClass}`;
            
            document.getElementById('detailScore').textContent = `${currentStudent.examScore}/100`;

            // Activity Summary
            const activityList = document.getElementById('activityList');
            activityList.innerHTML = `
                <li class="activity-item">
                    <span class="activity-label">สลับแท็บ</span>
                    <span class="activity-value">${currentStudent.activities.tabSwitch} ครั้ง</span>
                </li>
                <li class="activity-item">
                    <span class="activity-label">วางข้อความ</span>
                    <span class="activity-value">${currentStudent.activities.pasteAttempts} ครั้ง</span>
                </li>
                <li class="activity-item">
                    <span class="activity-label">เวลาตอบเฉลี่ย</span>
                    <span class="activity-value">${currentStudent.activities.avgResponseTime.toFixed(1)} วินาที</span>
                </li>
                <li class="activity-item">
                    <span class="activity-label">ตอบเร็วผิดปกติ</span>
                    <span class="activity-value">${currentStudent.activities.fastAnswers} ข้อ</span>
                </li>
                <li class="activity-item">
                    <span class="activity-label">การเคลื่อนเมาส์</span>
                    <span class="activity-value">${currentStudent.activities.mouseMovement}</span>
                </li>
                <li class="activity-item">
                    <span class="activity-label">หันหน้า</span>
                    <span class="activity-value">${currentStudent.activities.faceTurns} ครั้ง</span>
                </li>
            `;

            // AI Status
            const statusList = document.getElementById('statusList');
            statusList.innerHTML = `
                <li class="status-item">
                    <span class="status-icon ${currentStudent.status.faceFound ? 'status-ok' : 'status-error'}">
                        ${currentStudent.status.faceFound ? '✓' : '✗'}
                    </span>
                    <span>พบใบหน้า</span>
                </li>
                <li class="status-item">
                    <span class="status-icon ${currentStudent.status.personCount === 1 ? 'status-ok' : 'status-error'}">
                        ${currentStudent.status.personCount === 1 ? '✓' : '⚠'}
                    </span>
                    <span>พบผู้สอบ ${currentStudent.status.personCount} คน</span>
                </li>
                <li class="status-item">
                    <span class="status-icon ${!currentStudent.status.phoneFound ? 'status-ok' : 'status-warning'}">
                        ${!currentStudent.status.phoneFound ? '✓' : '⚠'}
                    </span>
                    <span>พบโทรศัพท์</span>
                </li>
                <li class="status-item">
                    <span class="status-icon ${!currentStudent.status.headDown ? 'status-ok' : 'status-warning'}">
                        ${!currentStudent.status.headDown ? '✓' : '⚠'}
                    </span>
                    <span>ก้มหน้าบ่อย</span>
                </li>
            `;

            // Event Log
            const eventList = document.getElementById('eventList');
            eventList.innerHTML = '';
            currentStudent.events.forEach(event => {
                const item = document.createElement('li');
                item.className = 'event-item';
                item.innerHTML = `
                    <span class="event-time">${event.time}</span>
                    <span class="event-description">${event.description}</span>
                `;
                eventList.appendChild(item);
            });

            // Evidence Grid
            const evidenceGrid = document.getElementById('evidenceGrid');
            evidenceGrid.innerHTML = '';
            currentStudent.evidence.forEach(evidence => {
                const item = document.createElement('div');
                item.className = 'evidence-item';
                item.innerHTML = `
                    <div class="evidence-image">${evidence.emoji}</div>
                    <div class="evidence-time">${evidence.time}</div>
                    <div class="evidence-description">${evidence.description}</div>
                `;
                evidenceGrid.appendChild(item);
            });
        }

        // Update Timer
        function updateTimer() {
            const timer = document.getElementById('timer');
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            timer.textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Update Current Time in Student Details
        function updateCurrentTime() {
            if (!currentStudent) return;
            
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('detailCurrentTime').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Start
        init();
    </script>
</body>
</html>
