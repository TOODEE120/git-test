<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลการทดสอบ - MATTEP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff1f2 0%, #fff5f5 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    .header {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      backdrop-filter: blur(14px);
      border: 1px solid #f3d7e6;
      border-radius: 28px;
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .header::before {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      background: rgba(244, 63, 94, 0.10);
      border-radius: 50%;
      top: -80px;
      right: -80px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .header p {
      color: #475569;
      font-size: 18px;
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 8px 24px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid #e9d5ff;
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(233, 213, 255, 0.6);
      font-weight: 500;
      margin-bottom: 5px;
    }

    .result {
      background: #ffffff;
      backdrop-filter: blur(12px);
      border: 1px solid #f3d7e6;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      text-align: center;
      margin-bottom: 35px;
      padding-bottom: 25px;
      border-bottom: 2px solid #f3d7e6;
    }

    .result-title {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 15px;
    }

    .student-info {
      background: #fffafc;
      border: 1px solid #f3d7e6;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      font-size: 15px;
      color: #475569;
      line-height: 1.8;
    }

    .student-info strong {
      color: #1e293b;
      font-weight: 600;
    }

    .score-section {
      text-align: center;
      margin: 30px 0;
      padding: 30px;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.08) 0%, rgba(251, 113, 133, 0.08) 100%);
      border-radius: 20px;
      border: 2px solid rgba(244, 63, 94, 0.2);
    }

    .score-label {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .score-value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(90deg, #f43f5e, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .essay-section {
      margin-top: 30px;
    }

    .essay-title {
      font-size: 20px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 20px;
      margin-top: 30px;
    }

    .essay-box {
      background: #fffafc;
      border: 1px solid #f3d7e6;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      line-height: 1.8;
      color: #475569;
    }

    .essay-question {
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .essay-answer {
      color: #475569;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .submit-time {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    hr {
      border: none;
      height: 1px;
      background: #f1f5f9;
      margin: 20px 0;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 30px;
      }

      .result {
        padding: 25px;
      }

      .score-value {
        font-size: 36px;
      }

      .result-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MATTEP</h1>
      <p>ระบบทำข้อสอบออนไลน์</p>
    </div>

    <div class="result">
      <div class="result-header">
        <div class="result-title">ผลการทดสอบ</div>
      </div>

      <div class="student-info">
        <strong>ชื่อ - นามสกุล:</strong> <span id="displayName">-</span><br>
        <strong>เลขที่:</strong> <span id="displayNo">-</span><br>
        <strong>ชั้นเรียน:</strong> <span id="displayClass">-</span>
      </div>

      <div class="score-section">
        <div class="score-label">คะแนนข้อปรนัย</div>
        <div class="score-value"><span id="displayScore">0</span> / 8</div>
      </div>

      <div class="essay-section">
        <div class="essay-title">คำตอบข้อเขียน</div>
        
        <div class="essay-box">
          <div class="essay-question">ข้อ 9: อธิบายว่า JavaScript ใช้ทำอะไร</div>
          <div class="essay-answer" id="displayEssay1">- ไม่ได้ตอบ -</div>
        </div>

        <div class="essay-box">
          <div class="essay-question">ข้อ 10: ถ้าออกแบบระบบกันโกงสอบ คุณจะทำยังไง?</div>
          <div class="essay-answer" id="displayEssay2">- ไม่ได้ตอบ -</div>
        </div>
      </div>

      <div class="submit-time">
        <p>ส่งข้อสอบเรียบร้อยแล้ว เวลา: <strong id="displayTime">-</strong></p>
      </div>

      <div class="action-buttons">
        <button class="btn btn-primary" onclick="goHome()">ส่งเรียบร้อย</button>
        <button class="btn btn-secondary" onclick="printResult()">พิมพ์ผลลัพธ์</button>
      </div>
    </div>
  </div>

  <script>
    // โหลดข้อมูลจาก sessionStorage
    window.addEventListener('load', () => {
      const studentName = sessionStorage.getItem('studentName') || 'ไม่ระบุชื่อ';
      const studentNo = sessionStorage.getItem('studentNo') || '-';
      const studentClass = sessionStorage.getItem('studentClass') || '-';
      const score = sessionStorage.getItem('score') || '0';
      const essay1 = sessionStorage.getItem('essay1') || '- ไม่ได้ตอบ -';
      const essay2 = sessionStorage.getItem('essay2') || '- ไม่ได้ตอบ -';
      const submitTime = sessionStorage.getItem('submitTime') || '-';

      // แสดงข้อมูลลงในหน้าเว็บ
      document.getElementById('displayName').innerText = studentName;
      document.getElementById('displayNo').innerText = studentNo;
      document.getElementById('displayClass').innerText = studentClass;
      document.getElementById('displayScore').innerText = score;
      document.getElementById('displayEssay1').innerText = essay1 || '- ไม่ได้ตอบ -';
      document.getElementById('displayEssay2').innerText = essay2 || '- ไม่ได้ตอบ -';
      document.getElementById('displayTime').innerText = submitTime;
    });

    function goHome() {
      // ล้างข้อมูล session และกลับหน้าแรก
      sessionStorage.clear();
      window.location.href = 'home.html';
    }

    function printResult() {
      window.print();
    }
  </script>
</body>
</html>
