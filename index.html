<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATTEP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff1f2 0%, #fff5f5 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    .header {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      backdrop-filter: blur(14px);
      border: 1px solid #f3d7e6;
      border-radius: 28px;
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .header::before {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      background: rgba(244,63,94,0.10);
      border-radius: 50%;
      top: -80px;
      right: -80px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .header p {
      color: #475569;
      font-size: 18px;
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 8px 24px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid #e9d5ff; /* ขอบสีม่วงอ่อน */
      border-radius: 999px;
      box-shadow: 0 0 15px rgba(233, 213, 255, 0.6); /* เอฟเฟกต์เรืองแสง */
      font-weight: 500;
      margin-bottom: 5px;
    }

    .top-info {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .badge {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
    }

    .timer-badge {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
      font-weight: bold;
    }

    .student-form {
      background: #ffffff;
      border: 1px solid #f3d7e6;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(244,63,94,0.08);
    }

    .form-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 15px;
      font-weight: 500;
      color: #475569;
    }

    .input-group input {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #f43f5e;
      box-shadow: 0 0 0 4px rgba(244,63,94,0.12);
    }

    .question-card {
      background: #ffffff;
      border: 1px solid #f3d7e6;
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: 0.25s ease;
    }

    .question-card:hover {
      transform: translateY(-3px);
      border-color: rgba(236,72,153,0.35);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    .question-number {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      font-weight: bold;
      margin-bottom: 18px;
      font-size: 18px;
    }

    .question-title {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choices label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      background: #fffafc;
      border: 1px solid #dbe4ee;
      cursor: pointer;
      transition: 0.2s;
      font-size: 16px;
    }

    .choices label:hover {
      background: #fff1f2;
      border-color: rgba(236,72,153,0.35);
    }

    input[type="radio"] {
      transform: scale(1.2);
      accent-color: #f43f5e;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border-radius: 18px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      padding: 18px;
      resize: vertical;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: #f43f5e;
      box-shadow: 0 0 0 4px rgba(244,63,94,0.15);
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 10px 25px rgba(236,72,153,0.25);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(244,63,94,0.40);
    }

    .submit-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result {
      margin-top: 30px;
      background: #ffffff;
      backdrop-filter: blur(12px);
      border: 1px solid #f3d7e6;
      border-radius: 24px;
      padding: 30px;
      display: none;
      animation: fade 0.5s ease;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .score {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #f43f5e, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .essay-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #fffafc;
      line-height: 1.8;
      border: 1px solid #fecdd3;
    }

    hr {
      border: none;
      height: 1px;
      background: #f1f5f9;
      margin: 20px 0;
    }

    @media(max-width: 768px) {
      .header h1 { font-size: 30px; }
      .question-title { font-size: 18px; }
      .submit-btn { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="student-form">
      <div class="form-title">ข้อมูลนักเรียน</div>
      <div class="form-grid">
        <div class="input-group">
          <label>ชื่อ - นามสกุล <span style="color:red">*</span></label>
          <input type="text" id="studentName" placeholder="กรอกชื่อ - นามสกุล">
        </div>
        <div class="input-group">
          <label>เลขที่ <span style="color:red">*</span></label>
          <input type="number" id="studentNo" placeholder="กรอกเลขที่">
        </div>
        <div class="input-group">
          <label>ชั้นเรียน <span style="color:red">*</span></label>
          <input type="text" id="studentClass" placeholder="เช่น ม.5/11">
        </div>
      </div>
    </div>

    <div class="header">
      <h1>MATTEP</h1>
      <p>ระบบทำข้อสอบออนไลน์</p>
      <div class="top-info">
        <div class="badge">วิชา: Web Technology</div>
        <div class="badge timer-badge" id="timerDisplay">เวลา: 60:00</div>
      </div>
    </div>

    <div id="examForm">
      <div class="question-card">
        <div class="question-number">1</div>
        <div class="question-title">ภาษา HTML ใช้ทำอะไร? <span style="color:red">*</span></div>
        <div class="choices">
          <label><input type="radio" name="q1" value="0"> ใช้ตัดต่อวิดีโอ</label>
          <label><input type="radio" name="q1" value="1"> ใช้สร้างหน้าเว็บไซต์</label>
          <label><input type="radio" name="q1" value="0"> ใช้ทำเพลง</label>
        </div>
      </div>

      <div class="question-card">
        <div class="question-number">2</div>
        <div class="question-title">CSS มีหน้าที่อะไร? <span style="color:red">*</span></div>
        <div class="choices">
          <label><input type="radio" name="q2" value="1"> ตกแต่งเว็บไซต์</label>
          <label><input type="radio" name="q2" value="0"> เก็บฐานข้อมูล</label>
          <label><input type="radio" name="q2" value="0"> สร้างไวรัส</label>
        </div>
      </div>

      <div class="question-card">
        <div class="question-number">3</div>
        <div class="question-title">อธิบายว่า JavaScript ใช้ทำอะไร</div>
        <textarea id="essay1" placeholder="พิมพ์คำตอบของคุณ..."></textarea>
      </div>

      <div class="question-card">
        <div class="question-number">4</div>
        <div class="question-title">ถ้าออกแบบระบบกันโกงสอบ คุณจะทำยังไง?</div>
        <textarea id="essay2" placeholder="พิมพ์คำตอบของคุณ..."></textarea>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitExam(false)">
      ส่งข้อสอบ
    </button>

    <div class="result" id="resultBox">
      <h2 id="studentInfoResult"></h2>
      <div class="score" id="scoreText"></div>
      <p>ส่งข้อสอบเรียบร้อยแล้ว บันทึกข้อมูลเวลา: <span id="submitTime"></span></p>

      <hr>

      <h2>คำตอบข้อเขียน</h2>
      <div class="essay-box">
        <strong>ข้อ 3:</strong>
        <p id="essayShow1"></p>
      </div>
      <div class="essay-box">
        <strong>ข้อ 4:</strong>
        <p id="essayShow2"></p>
      </div>
    </div>

  </div>

  <script>
    // --- ระบบจัดการเวลา (Timer) ---
    let timeInSeconds = 60 * 60; // 60 นาที
    let timerInterval;

    function startTimer() {
      timerInterval = setInterval(() => {
        timeInSeconds--;
        let minutes = Math.floor(timeInSeconds / 60);
        let seconds = timeInSeconds % 60;
        
        // เติมเลข 0 ข้างหน้าถ้าวินาทีน้อยกว่า 10
        let displaySeconds = seconds < 10 ? "0" + seconds : seconds;
        document.getElementById('timerDisplay').innerText = `เวลา: ${minutes}:${displaySeconds}`;

        if (timeInSeconds <= 0) {
          clearInterval(timerInterval);
          alert("หมดเวลาทำข้อสอบ! ระบบจะส่งคำตอบโดยอัตโนมัติ");
          submitExam(true); // true หมายถึงบังคับส่งเพราะหมดเวลา
        }
      }, 1000);
    }

    // เริ่มจับเวลาทันทีที่เปิดหน้าเว็บ
    window.onload = startTimer;


    // --- ระบบตรวจและส่งข้อสอบ ---
    function submitExam(isAutoSubmit) {
      const studentName = document.getElementById('studentName').value.trim();
      const studentNo = document.getElementById('studentNo').value.trim();
      const studentClass = document.getElementById('studentClass').value.trim();

      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.querySelector('input[name="q2"]:checked');

      // 1. ตรวจสอบการกรอกข้อมูล (Validation) - ทำเฉพาะถ้าผู้ใช้กดส่งเอง
      if (!isAutoSubmit) {
        if (!studentName || !studentNo || !studentClass) {
          alert("กรุณากรอกข้อมูลนักเรียนให้ครบถ้วนก่อนส่งข้อสอบ");
          return;
        }
        if (!q1 || !q2) {
          alert("กรุณาตอบคำถามปรนัย (ข้อกา) ให้ครบทุกข้อ");
          return;
        }

        // 2. หน้าต่างยืนยัน (Confirmation)
        const confirmSubmit = confirm("คุณแน่ใจหรือไม่ว่าต้องการส่งข้อสอบ?\nเมื่อส่งแล้วจะไม่สามารถแก้ไขได้");
        if (!confirmSubmit) return;
      }

      // หยุดเวลา
      clearInterval(timerInterval);

      // คำนวณคะแนน
      let score = 0;
      if (q1) score += Number(q1.value);
      if (q2) score += Number(q2.value);

      const essay1 = document.getElementById('essay1').value.trim();
      const essay2 = document.getElementById('essay2').value.trim();

      // แสดงผลลัพธ์
      document.getElementById('studentInfoResult').innerText = 
        `${studentName || 'ไม่ระบุชื่อ'} | เลขที่ ${studentNo || '-'} | ชั้น ${studentClass || '-'}`;
      document.getElementById('scoreText').innerText = `คะแนนข้อกา ${score} / 2`;
      document.getElementById('essayShow1').innerText = essay1 || '- ไม่ได้ตอบ -';
      document.getElementById('essayShow2').innerText = essay2 || '- ไม่ได้ตอบ -';
      
      // บันทึกเวลาที่ส่ง
      const now = new Date();
      document.getElementById('submitTime').innerText = now.toLocaleTimeString('th-TH');

      // แสดงกล่องผลลัพธ์
      document.getElementById('resultBox').style.display = 'block';

      // 3. ปิดการใช้งานฟอร์ม (Disable Inputs)
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').innerText = "ส่งข้อสอบสำเร็จแล้ว";
      
      // เลือก input และ textarea ทั้งหมดมาปิดการใช้งาน
      const allInputs = document.querySelectorAll('input, textarea');
      allInputs.forEach(input => input.disabled = true);

      // เลื่อนหน้าจอลงมาดูผลลัพธ์
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }
  </script>

</body>
</html>
