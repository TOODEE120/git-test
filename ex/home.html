<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เริ่มทำข้อสอบ - MATTEP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff1f2 0%, #fff5f5 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .start-exam-card {
      background: #ffffff;
      backdrop-filter: blur(14px);
      border: 1px solid #f3d7e6;
      border-radius: 28px;
      padding: 50px 40px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .mattep-header {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .start-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.3);
      margin-bottom: 15px;
    }

    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 35px rgba(244, 63, 94, 0.4); }

    .teacher-btn {
      width: 100%;
      padding: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      background: transparent;
      color: #64748b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .teacher-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #475569;
    }

    /* Modal Login Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 999;
      backdrop-filter: blur(5px);
    }

    .login-box {
      background: white; border-radius: 24px; padding: 30px; max-width: 400px; width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); text-align: left;
    }

    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px;
      border: 1px solid #cbd5e1; outline: none; transition: 0.3s;
    }

    .login-box input:focus { border-color: #f43f5e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="start-exam-card">
        <div class="mattep-header">MATTEP</div>
        <p class="subtitle">ระบบประเมินผลสอบออนไลน์ พร้อม AI ตรวจจับพฤติกรรม</p>

        <button class="start-btn" onclick="startExam()">👨‍🎓 เริ่มทำข้อสอบ (สำหรับนักเรียน)</button>
        <button class="teacher-btn" onclick="openLogin()">👨‍🏫 เข้าสู่ระบบ (สำหรับผู้สอน)</button>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="login-box">
      <h2 style="color: #1e293b; margin-bottom: 20px;">เข้าสู่ระบบครูผู้สอน</h2>
      <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">ทดสอบใช้ Username: admin / Password: 1234</p>
      <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน (Username)" />
      <input type="password" id="password" placeholder="รหัสผ่าน (Password)" />
      <div style="color: red; font-size: 12px; margin-bottom: 10px; display: none;" id="loginError">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!</div>
      
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button onclick="closeLogin()" style="padding: 10px 20px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer;">ยกเลิก</button>
        <button onclick="attemptLogin()" style="padding: 10px 20px; border-radius: 10px; border: none; background: #f43f5e; color: white; cursor: pointer; font-weight: bold;">เข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <script>
    function startExam() {
      // ตรวจสอบระบบ Preview ของ AI
      if (window.location.protocol === 'blob:' || window.location.hostname === '' || window.self !== window.top) {
        alert("คำเตือน: คุณรันอยู่ในโหมด Preview อาจจะเปลี่ยนหน้าอัตโนมัติไม่ได้ โปรดเปิดไฟล์นี้ในเครื่องของคุณโดยตรง");
      }
      window.location.href = 'index.html';
    }

    function openLogin() {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('loginError').style.display = 'none';
    }

    function closeLogin() {
      document.getElementById('loginModal').style.display = 'none';
    }

    function attemptLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      // รหัสผ่านจำลองสำหรับการทดสอบ
      if (user === 'admin' && pass === '1234') {
          sessionStorage.setItem('isTeacherLoggedIn', 'true');
          if (window.location.protocol === 'blob:' || window.location.hostname === '' || window.self !== window.top) {
           alert("เข้าสู่ระบบสำเร็จ! แต่โหมด Preview อาจบล็อกการเปลี่ยนหน้า กรุณารันในเครื่องจริง");
        }
        window.location.href = 'ai-proctoring-dashboard.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }
  </script>
</body>
</html>
